# run.xadi.eu, behind the host's nginx. Logs must never hold coordinates, so read this before changing it.

# Log only a fixed list of paths (the same as LOGGABLE_PATHS in middleware/logging.js). The decoded $uri can hold a
# query string (`/api/window%3Flat%3D52.37`), so any other path is logged as `other`.
map $uri $run_window_path {
    default            other;
    /                  /;
    /api/window        /api/window;
    /health            /health;
    /health/cache      /health/cache;
    /openapi.yaml      /openapi.yaml;
    /tailwind.css      /tailwind.css;
    /favicon.ico       /favicon.ico;
}

# No $request, $request_uri, $args, $uri or $http_referer: they carry query strings. No client address either.
log_format runwindow '$time_iso8601 $request_method $run_window_path $status $body_bytes_sent $request_time';

# TLS is left to certbot: `certbot --nginx --no-redirect -d run.xadi.eu`. It adds `listen 443 ssl` and the certificate
# to the first block with this server_name, so this block must stay first. Without --no-redirect it also adds an
# unneeded redirect to the port 80 block below.
server {
    # A host-only placeholder, because a block needs a listen until certbot adds its own. Port 80 belongs to the block
    # below (with both on it, nginx ignores one), and a plain listen on the TLS port would clash with what certbot adds.
    # Delete this line once certbot has run.
    listen 127.0.0.1:3081;
    server_name run.xadi.eu;

    access_log /var/log/nginx/run-window.access.log runwindow;
    # nginx writes the full request line, query string included, into error-level entries such as upstream
    # connection failures. `crit` keeps those out.
    error_log /var/log/nginx/run-window.error.log crit;

    # Every proxy_set_header lives here and none in a location: one in a location would replace all of these.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    # Live counters could reveal whether a location was requested today: reachable from the host only.
    # Case-insensitive because Express routes are.
    location ~* ^/health/cache {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3003;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
    }
}

# Committed so certbot has no redirect block to create: one of its own would have no access_log, so it would inherit the
# host's log format and write the full request line, with exact coordinates, for any http:// request.
server {
    listen 80;
    server_name run.xadi.eu;

    access_log /var/log/nginx/run-window.access.log runwindow;
    error_log /var/log/nginx/run-window.error.log crit;

    return 301 https://$host$request_uri;
}
