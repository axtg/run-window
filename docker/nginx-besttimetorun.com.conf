# besttimetorun.com, behind the host's nginx. Logs must never hold coordinates, so read this before changing it.

# Log only a fixed list of paths (the same as LOGGABLE_PATHS in middleware/logging.js). The decoded $uri can hold a
# query string (`/api/window%3Flat%3D52.37`), so any other path is logged as `other`.
map $uri $run_window_path {
    # Case-insensitive, with an optional trailing slash, because Express serves those variants too.
    # $uri already has doubled slashes merged.
    default                    other;
    ~*^/$                      /;
    ~*^/api/window/?$          /api/window;
    ~*^/api/capacity/?$        /api/capacity;
    ~*^/api/places/?$          /api/places;
    ~*^/mcp/?$                 /mcp;
    ~*^/health/?$              /health;
    ~*^/health/cache/?$        /health/cache;
    ~*^/openapi\.yaml/?$       /openapi.yaml;
    ~*^/tailwind\.css/?$       /tailwind.css;
    ~*^/favicon\.ico/?$        /favicon.ico;
    ~*^/route\.js/?$           /route.js;
    ~*^/plan\.js/?$            /plan.js;
    ~*^/strip\.js/?$           /strip.js;
    ~*^/settings\.js/?$        /settings.js;
    ~*^/analytics\.js/?$       /analytics.js;
    ~*^/app\.js/?$             /app.js;
    ~*^/vendor/weather-effects/rain\.js/?$ /vendor/weather-effects/rain.js;
    ~*^/vendor/weather-effects/snow\.js/?$ /vendor/weather-effects/snow.js;
    ~*^/vendor/weather-effects/sky\.js/?$ /vendor/weather-effects/sky.js;
    ~*^/vendor/weather-effects/fog\.js/?$ /vendor/weather-effects/fog.js;
    ~*^/vendor/weather-effects/hail\.js/?$ /vendor/weather-effects/hail.js;
    ~*^/vendor/weather-effects/wind\.js/?$ /vendor/weather-effects/wind.js;
    ~*^/vendor/weather-effects/sleet\.js/?$ /vendor/weather-effects/sleet.js;
    ~*^/manifest\.webmanifest/?$ /manifest.webmanifest;
    ~*^/sw\.js/?$              /sw.js;
    ~*^/icon\.svg/?$           /icon.svg;
    ~*^/icon-192\.png/?$       /icon-192.png;
    ~*^/icon-512\.png/?$       /icon-512.png;
    ~*^/share-target/?$        /share-target;
    ~*^/network/xadi\.png/?$ /network/xadi.png;
    ~*^/network/dap\.svg/?$ /network/dap.svg;
    ~*^/network/emailconnect\.png/?$ /network/emailconnect.png;
    ~*^/network/webhooktest\.png/?$ /network/webhooktest.png;
    ~*^/network/stackcheck\.png/?$ /network/stackcheck.png;
    ~*^/og\.png/?$             /og.png;
    ~*^/apple-touch-icon\.png/?$ /apple-touch-icon.png;
    ~*^/robots\.txt/?$         /robots.txt;
    ~*^/sitemap\.xml/?$        /sitemap.xml;
    ~*^/llms\.txt/?$           /llms.txt;
    ~*^/\.well-known/security\.txt/?$ /.well-known/security.txt;
}

# No $request, $request_uri, $args, $uri or $http_referer: they carry query strings. No client address either.
log_format runwindow '$time_iso8601 $request_method $run_window_path $status $body_bytes_sent $request_time';

# TLS is left to certbot: `certbot --nginx --no-redirect -d besttimetorun.com`. It adds `listen 443 ssl` and the
# certificate to the first block with this server_name, so this block must stay first. Without --no-redirect it also adds
# an unneeded redirect to the port 80 block below.
# IPv6: certbot adds the IPv4 listen only. Next to its `listen 443 ssl; # managed by Certbot`, add by hand
#     listen [::]:443 ssl;
# in this block and in the www block below, then `nginx -t` and reload. Add `ipv6only=on` only if no other site on
# the host already sets it for [::]:443 (nginx allows it once per address and port).
server {
    # A host-only placeholder, because a block needs a listen until certbot adds its own. Port 80 belongs to the block
    # below (with both on it, nginx ignores one), and a plain listen on the TLS port would clash with what certbot adds.
    # Delete this line once certbot has run.
    listen 127.0.0.1:3081;
    server_name besttimetorun.com;

    access_log /var/log/nginx/run-window.access.log runwindow;
    # nginx writes the full request line, query string included, into error-level entries such as upstream
    # connection failures. `crit` keeps those out.
    error_log /var/log/nginx/run-window.error.log crit;
    server_tokens off; # no nginx version in the Server header or error pages

    # Every proxy_set_header lives here and none in a location: one in a location would replace all of these.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    # Live counters could reveal whether a location was requested today: reachable from the host only.
    # Case-insensitive because Express routes are.
    location ~* ^/health/cache {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3003;
    }

    # A route shared from the Android share sheet is a POST of the file to this path. The page's service worker answers
    # it on the device; if the worker isn't there yet, nginx answers it here and never proxies it, so the body never
    # reaches Node, and the page says the share didn't arrive. The only location without proxy_pass. Size 0 turns
    # nginx's body size check off (it runs before return), so a file of any size is discarded and redirected instead
    # of answered with 413.
    location ~* ^/share-target/?$ {
        client_max_body_size 0;
        return 303 /?share=failed;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
    }
}

# www only redirects, every path (the API too) to the same path on besttimetorun.com. Over TLS it needs a certificate of
# its own: `certbot --nginx --no-redirect -d www.besttimetorun.com`, then the IPv6 listen as above. Delete the
# placeholder listen once certbot's lines are in.
server {
    listen 127.0.0.1:3082;
    server_name www.besttimetorun.com;

    access_log /var/log/nginx/run-window.access.log runwindow;
    error_log /var/log/nginx/run-window.error.log crit;
    server_tokens off; # no nginx version in the Server header or error pages

    return 301 https://besttimetorun.com$request_uri;
}

# Committed so certbot has no redirect block to create: one of its own would have no access_log, so it would inherit the
# host's log format and write the full request line, with exact coordinates, for any http:// request.
server {
    listen 80;
    listen [::]:80;
    server_name besttimetorun.com www.besttimetorun.com;

    access_log /var/log/nginx/run-window.access.log runwindow;
    error_log /var/log/nginx/run-window.error.log crit;
    server_tokens off; # no nginx version in the Server header or error pages

    return 301 https://besttimetorun.com$request_uri;
}
