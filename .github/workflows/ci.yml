name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate OpenAPI spec
        run: npm run validate-api

      - name: Check the compiled CSS is up to date
        run: |
          npm run build:css
          git diff --exit-code public/tailwind.css || (echo "Run npm run build:css and commit the result" && exit 1)

      - name: Check the TRMNL transform is up to date
        run: |
          npm run build:trmnl
          git diff --exit-code integrations/trmnl-running-board/transform.js || (echo "Run npm run build:trmnl and commit the result" && exit 1)

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Dev tooling never ships, so its advisories are reported without failing the job.
      - name: Report all dependency advisories
        run: npm audit
        continue-on-error: true
